# La serpiente que recorre el gráfico de contribuciones, con los colores del perfil.
# Se regenera cada día y deja los SVG en la rama «output», que es de donde los lee el README.
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"   # cada día a las 05:00 UTC
  workflow_dispatch:       # botón «Run workflow» en la pestaña Actions
  push:
    branches: [main]
    paths: [".github/workflows/serpiente.yml"]   # y la primera vez, nada más subirlo

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Claro: grises y azules de la paleta (de vacío a mucha actividad) y la serpiente en el azul de marca.
          # Oscuro: los mismos pasos sobre el azul noche y la serpiente en el acento claro.
          outputs: |
            dist/serpiente-claro.svg?color_snake=#0A5FD1&color_dots=#E9EEF6,#C3D9F7,#8DBBF5,#4A90E8,#0A5FD1
            dist/serpiente-oscuro.svg?palette=github-dark&color_snake=#6AAEFF&color_dots=#151F33,#1B3A6B,#2A5FAF,#4A8DE6,#6AAEFF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
